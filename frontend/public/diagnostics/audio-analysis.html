<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音频分析诊断</title>
  <style>
    body { max-width: 700px; margin: 40px auto; padding: 0 20px; background: #081522; color: #e8f3f7; font: 15px/1.7 system-ui, sans-serif; }
    button, input { padding: 10px 18px; border: 1px solid #69cfc7; border-radius: 8px; background: #12373f; color: inherit; font: inherit; }
    input { width: 150px; margin-right: 8px; }
    button { cursor: pointer; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 18px; border-radius: 10px; background: #102536; }
  </style>
</head>
<body>
  <h1>在线音频分析诊断</h1>
  <p>短暂播放指定歌曲，在静音输出下测量真实频谱。不会保存音频或更改电台播放器。</p>
  <label for="song-id">歌曲 ID：</label><input id="song-id" inputmode="numeric" />
  <button id="start" type="button">开始测试</button>
  <pre id="result">等待开始</pre>
  <script>
    const output = document.querySelector("#result");
    const songIdInput = document.querySelector("#song-id");
    songIdInput.value = new URLSearchParams(location.search).get("song") || "1039333";
    let running = false;

    async function run() {
      if (running) return;
      const songId = songIdInput.value.trim();
      if (!songId) { output.textContent = "请先输入歌曲 ID"; return; }
      running = true;
      const audio = new Audio();
      let context;
      let sampler;
      const metrics = { song_id: songId, state: "loading", samples: 0, peak: 0, nonzero_samples: 0, media_time: 0 };
      const show = () => { output.textContent = JSON.stringify(metrics, null, 2); };
      show();
      try {
        // 独立诊断页也先验证同源访问，不要求用户先打开主页面。
        const access = await fetch("/api/local-access", { credentials: "same-origin", cache: "no-store", signal: AbortSignal.timeout(5000) });
        if (!access.ok) throw new Error("本机访问验证失败，请刷新页面");
        const response = await fetch(`/api/ncm/playurl/${encodeURIComponent(songId)}`);
        const result = await response.json();
        if (!response.ok || !result.success || !result.url) throw new Error(result.message || "无法获取播放地址");

        // 必须在设置 src 之前启用 CORS；只分析这只临时播放器，不碰主播放器。
        audio.crossOrigin = "anonymous";
        audio.preload = "auto";
        context = new AudioContext();
        const source = context.createMediaElementSource(audio);
        const analyser = context.createAnalyser();
        analyser.fftSize = 2048;
        const silentOutput = context.createGain();
        silentOutput.gain.value = 0;
        source.connect(analyser);
        analyser.connect(silentOutput);
        silentOutput.connect(context.destination);
        const bins = new Uint8Array(analyser.frequencyBinCount);
        sampler = setInterval(() => {
          analyser.getByteFrequencyData(bins);
          metrics.samples += 1;
          const peak = Math.max(...bins);
          metrics.peak = Math.max(metrics.peak, peak);
          if (peak > 0) metrics.nonzero_samples += 1;
          metrics.media_time = Number(audio.currentTime.toFixed(2));
          show();
        }, 100);

        audio.src = result.url;
        await context.resume();
        await audio.play();
        metrics.state = "playing";
        show();
        await new Promise((resolve) => setTimeout(resolve, 3500));
        metrics.state = metrics.nonzero_samples > 0 ? "analysis_ok" : "analysis_zero";
      } catch (error) {
        metrics.state = "error";
        metrics.error = error instanceof Error ? error.message : String(error);
      } finally {
        clearInterval(sampler);
        audio.pause();
        audio.removeAttribute("src");
        audio.load();
        if (context) await context.close();
        show();
        running = false;
      }
    }

    document.querySelector("#start").addEventListener("click", run);
    if (new URLSearchParams(location.search).has("autorun")) run();
  </script>
</body>
</html>
